[project]
name = "agent-tools"
version = "0.1.0"
description = "Turn Python functions into LLM tools and LLM text into typed objects, with validation and retries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]
keywords = ["llm", "agents", "function-calling", "structured-output", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.scripts]
agent-tools = "agent_tools.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true